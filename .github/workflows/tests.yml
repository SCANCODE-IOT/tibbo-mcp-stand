name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SCANCODE-IOT/tibbo-ai-skills
          path: _skills
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (simulator, fake GPIO, mock LLMs)
        env:
          TIBBO_SKILLS_DIR: ${{ github.workspace }}/_skills/skills
          PYTHONUTF8: "1"
        run: python -W ignore -m unittest discover -s tests -v
